{% extends "base.html" %}
{% block title %}Новый опрос — {{ APP_NAME }}{% endblock %}
{% block content %}<div class="simple-page"><section class="settings-card poll-editor"><a class="back-link" href="{% url 'chat:conversation' conversation.pk %}">← {{ conversation.title|default:"Чат" }}</a><h1>Новый опрос</h1><p class="subtle">До 10 вариантов. Для multiple choice сотрудник сможет выбрать несколько ответов.</p><form method="post" class="stack">{% csrf_token %}<label>Вопрос</label><input name="question" maxlength="300" required placeholder="Например: Когда проводить техработы?"><label>Варианты — по одному на строку</label><textarea name="options" rows="8" required placeholder="Пятница&#10;Суббота&#10;Воскресенье"></textarea><div class="preference-list"><label class="preference-row"><div><b>Анонимный опрос</b><span>В обычном интерфейсе не показывать кто за что голосовал</span></div><input type="checkbox" name="anonymous"></label><label class="preference-row"><div><b>Несколько вариантов</b><span>Разрешить multiple choice</span></div><input type="checkbox" name="multiple_choice"></label></div><label>Закрыть автоматически</label><input type="datetime-local" name="closes_at"><button class="tg-button primary">Создать опрос</button></form></section></div>{% endblock %}
