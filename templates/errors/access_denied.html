<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }} — R-Messanger</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1621;color:#f4f8fb;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(92vw,470px);padding:38px 34px;border:1px solid rgba(255,255,255,.09);border-radius:24px;background:rgba(23,33,43,.96);box-shadow:0 22px 70px rgba(0,0,0,.34);text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#229ed9;font-size:27px;font-weight:800}.name{font-size:25px;font-weight:800}.title{margin:23px 0 8px;font-size:19px;font-weight:700}.message{margin:0;color:#9aabb8;line-height:1.55;font-size:14px}.back{display:inline-block;margin-top:24px;padding:11px 18px;border-radius:12px;background:#229ed9;color:#fff;text-decoration:none;font-weight:700}</style>
</head>
<body><main class="card"><div class="mark">A</div><div class="name">R-Messanger</div><div class="title">{{ title }}</div><p class="message">{{ message }}</p><a class="back" href="/auth/login/">Вернуться ко входу</a></main></body>
</html>
