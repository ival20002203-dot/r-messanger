global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: localgram
    metrics_path: /ops/metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["web1:8000","web2:8000"]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
