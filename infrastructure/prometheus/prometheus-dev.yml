global:
  scrape_interval: 15s
scrape_configs:
  - job_name: localgram-dev
    metrics_path: /ops/metrics/
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs: [{targets: ["web:8000"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
