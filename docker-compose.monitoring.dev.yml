services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infrastructure/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - localgram_prometheus_dev:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - localgram_grafana_dev:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-localgram}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-localgram}?sslmode=disable
  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment: {REDIS_ADDR: redis://redis:6379}
volumes:
  localgram_prometheus_dev:
  localgram_grafana_dev:
