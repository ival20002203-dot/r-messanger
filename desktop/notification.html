<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#fff;overflow:hidden}
.card{height:92px;margin:8px;border-radius:16px;background:rgba(11,34,28,.98);border:1px solid rgba(39,194,122,.32);box-shadow:0 12px 34px rgba(0,0,0,.38);display:flex;align-items:center;gap:12px;padding:10px 14px;box-sizing:border-box;cursor:pointer;user-select:none}
.logo{width:34px;height:34px;border-radius:9px;object-fit:cover;flex:0 0 auto}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#229ed9;display:none;flex:0 0 auto}
.copy{min-width:0;flex:1}.brand{font-size:11px;color:#72d8ab;margin-bottom:2px;font-weight:600}.title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{font-size:13px;color:#c4d6cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.close{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:#8ca69c;font-size:18px;cursor:pointer}.close:hover{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="assets/icon.png" alt="R-Messanger">
  <img class="avatar" id="avatar" alt="">
  <div class="copy"><div class="brand">R-Messanger</div><div class="title" id="title"></div><div class="body" id="body"></div></div>
  <button class="close" id="close" aria-label="Закрыть">×</button>
</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('title').textContent=q.get('title')||'R-Messanger';
document.getElementById('body').textContent=q.get('body')||'Новое сообщение';
const avatar=q.get('avatar')||'';if(avatar){const a=document.getElementById('avatar');a.src=avatar;a.style.display='block';a.onerror=()=>a.style.display='none'}
document.getElementById('card').addEventListener('click',()=>window.RMesNotice?.open?.());
document.getElementById('close').addEventListener('click',e=>{e.stopPropagation();window.RMesNotice?.close?.()});
</script>
</body>
</html>
